<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../assets/css/main.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Red+Rose:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="../assets/images/color=green.svg"
      type="image/x-icon"
    />
    <title>Konfirmasi Email</title>
  </head>
  <body>
    <div class="container max-w-[768px]">
      <div
        class="flex flex-col items-center justify-center p-4 h-dvh bg-green-50"
      >
        <div class="flex flex-col w-full">
          <!-- Ilustrasi -->
          <img
            src="../assets/images/email sent.svg"
            alt="Ilustrasi"
            class="h-[160px]"
          />
          <!-- ./Ilustrasi -->

          <!-- Title + Descripton -->
          <div class="flex flex-col mt-8 mb-5">
            <h1 class="text-lg font-semibold text-center text-gray-900">
              Konfirmasi Email
            </h1>
            <p class="text-xs font-medium text-center text-gray-400">
              Silahkan cek inbox email Anda dan klik link yang kami kirim untuk
              konfirmasi email Anda. Jika belum muncul tunggu beberapa menit
              atau klik tombol ini
            </p>
          </div>
          <!-- ./Title + Descripton -->

          <!-- Button Action -->
          <button
            type="button"
            class="inline-flex items-center bg-transparant p-2.5 rounded-2xl text-brands-light-green uppercase gap-2 text-sm font-semibold hover:bg-brands-light-green hover:text-white focus:outline-none focus:ring-2 focus:ring-green-400 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-transparent disabled:text-gray-400 border-2 border-brands-light-green justify-center"
          >
            <span class="i-material-symbols-send-rounded text-icon-md"></span>
            <span>KIRIM ULANG</span>
          </button>
          <!-- ./Button Action -->

          <!-- Help text -->
          <p class="mt-3 text-xs text-center">
            <a
              href="#"
              class="text-xs font-semibold text-brands-light-green hover:text-brands-dark-green/70 focus:outline-none focus:ring-2 focus:ring-green-400"
              >Keluar</a
            >
          </p>
          <!-- ./Help text -->
        </div>
      </div>
    </div>
    <script src="../assets/js/konfirmasi.js"></script>
  </body>
</html>
