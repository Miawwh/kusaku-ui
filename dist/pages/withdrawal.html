<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../assets/css/main.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Red+Rose:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="../assets/images/favicon.ico"
      type="image/x-icon"
    />
    <title>Withdrawal</title>
  </head>
  <body>
    <div class="container max-w-[768px]">
      <!-- App Bar -->
      <div
        class="fixed top-0 left-0 z-10 flex items-center w-full gap-5 p-4 text-gray-900 bg-white"
      >
        <a
          href="#"
          class="hover:text-gray-400 focus:outline-none focus:ring-2 focus:ring-green-400"
          onclick="history.back()"
        >
          <span
            class="block i-material-symbols-arrow-left-alt-rounded text-icon-md"
          ></span>
        </a>
        <p class="text-lg font-semibold">Buat Penarikan Saldo</p>
      </div>
      <!-- ./ App Bar -->

      <div class="flex min-h-dvh flex-col gap-4 bg-green-50 pb-[80px]">
        <div class="mt-[92px] flex w-full flex-col gap-8 p-8">
          <!-- Card Withdrawal -->
          <form
            action="#"
            method="post"
            class="flex flex-col gap-4 rounded-[20px] bg-white p-2.5 shadow-md"
          >
            <!-- Input Nominal -->
            <div class="flex flex-col gap-y-1.5">
              <label
                for="input-nominal"
                class="text-sm font-medium text-gray-900 uppercase ps-4"
                >NOMINAL</label
              >
              <div class="relative">
                <input
                  id="input-nominal"
                  class="w-full p-3 text-sm text-gray-900 bg-white border border-gray-400 rounded-2xl pe-12 ps-12 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-green-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:invalid:ring-red-900 peer disabled:border-gray-300 disabled:bg-gray-100"
                  type="number"
                  inputmode="numeric"
                  placeholder="Tersedia: Rp. 20.000.000"
                />
                <div
                  class="absolute inset-y-0 flex items-center text-gray-400 start-0 text-icon-md ps-4 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                >
                  <span
                    class="i-material-symbols-account-balance-wallet"
                  ></span>
                </div>
              </div>
            </div>
            <!-- ./Input Nominal -->

            <!-- Input Pin -->
            <div class="flex flex-col gap-y-1.5">
              <label
                for="input-pin"
                class="text-sm font-medium text-gray-900 uppercase ps-4"
                >PIN</label
              >
              <div class="relative">
                <input
                  id="input-pin"
                  class="w-full p-3 text-sm text-gray-900 bg-white border border-gray-400 rounded-2xl pe-12 ps-12 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-green-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:invalid:ring-red-900 peer disabled:border-gray-300 disabled:bg-gray-100"
                  type="text"
                  placeholder="Masukan 6 digit PIN"
                />
                <div
                  class="absolute inset-y-0 flex items-center text-gray-400 start-0 text-icon-md ps-4 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                >
                  <span class="i-material-symbols-security-rounded"></span>
                </div>
              </div>
            </div>
            <!-- ./Input pin -->

            <!-- Button Save Data -->
            <button
              type="button"
              class="inline-flex items-center bg-brands-light-green p-2.5 rounded-2xl text-white uppercase gap-2 text-sm font-semibold hover:bg-brands-dark-green focus:outline-none focus:ring-2 focus:ring-green-400 disabled:cursor-not-allowed disabled:bg-gray-200 disabled:text-gray-400 justify-center"
            >
              <span class="i-material-symbols-save-rounded text-icon-md"></span>
              <span>PROSES PERMINTAAN</span>
            </button>
            <!-- ./Button Save Data -->
            <!-- Help text -->
            <p class="mt-3 text-xs text-center">
              Proses pencairan maks 2 hari kerja.
              <br />
              <a
                href="#"
                class="text-xs font-semibold text-brands-light-green hover:text-brands-dark-green/70 focus:outline-none focus:ring-2 focus:ring-green-400"
                >Hubungi Pusat Bantuan</a
              >
              jika ada kendala
            </p>
            <!-- ./Help text -->
          </form>

          <!-- ./ Card Withdarawal -->
        </div>
      </div>

      <!-- Navbar -->
      <div
        class="fixed bottom-0 left-0 z-10 flex w-full bg-white justify-evenly"
      >
        <a
          href="dashboard.html"
          class="flex flex-col items-center w-full p-3 text-gray-900 group hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-green-400"
        >
          <span
            class="inline i-material-symbols-home-outline-rounded text-icon-md group-hover:hidden"
          ></span>
          <span
            class="hidden i-material-symbols-home-rounded text-icon-md group-hover:inline"
          ></span>
          <span class="text-xs font-semibold">Beranda</span>
        </a>
        <a
          href="transaction-history.html"
          class="flex flex-col items-center w-full p-3 text-gray-900 group hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-green-400"
        >
          <span
            class="inline i-material-symbols-receipt-outline-rounded text-icon-md group-hover:hidden"
          ></span>
          <span
            class="hidden i-material-symbols-receipt-rounded text-icon-md group-hover:inline"
          ></span>
          <span class="text-xs font-semibold">Riwayat</span>
        </a>
        <a
          href="account.html"
          class="flex flex-col items-center w-full p-3 text-gray-900 group hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-green-400"
        >
          <span
            class="inline i-material-symbols-person-outline-rounded text-icon-md group-hover:hidden"
          ></span>
          <span
            class="hidden i-material-symbols-person-rounded text-icon-md group-hover:inline"
          ></span>
          <span class="text-xs font-semibold">Akun</span>
        </a>
      </div>
      <!-- ./ Navbar -->
    </div>
  </body>
</html>
