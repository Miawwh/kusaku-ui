<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../assets/css/main.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Red+Rose:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="../assets/images/color=green.svg"
      type="image/x-icon"
    />
    <title>Riset PIN</title>
  </head>
  <body>
    <div class="container max-w-[768px]">
      <div
        class="flex flex-col items-center justify-center p-4 h-dvh bg-green-50"
      >
        <div class="flex flex-col w-full">
          <!-- Ilustrasi -->
          <img
            src="../assets/images/fingerprint.svg"
            alt="Ilustrasi"
            class="h-[160px]"
          />
          <!-- ./Ilustrasi -->

          <!-- Title + Descripton -->
          <div class="flex flex-col mt-8 mb-5">
            <h1 class="text-lg font-semibold text-center text-gray-900">
              Reset PIN Lama
            </h1>
            <p class="text-xs font-medium text-center text-gray-400">
              Buat PIN yang aman dan mudah diingat
            </p>
          </div>
          <!-- ./Title + Descripton -->
          <!-- Form -->
          <form action="#" method="post" class="flex flex-col gap-4">
            <!-- Input PIN -->
            <div class="flex flex-col gap-y-1.5">
              <div class="relative">
                <input
                  class="w-full p-3 text-sm text-gray-900 bg-white border border-gray-400 rounded-2xl pe-12 ps-12 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-green-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:invalid:ring-red-900 peer disabled:border-gray-300 disabled:bg-gray-100"
                  inputmode="numeric"
                  placeholder="6 Digit PIN"
                />
                <div
                  class="absolute inset-y-0 flex items-center text-gray-400 start-0 text-icon-md ps-4 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                >
                  <span class="i-material-symbols-security-rounded"></span>
                </div>
              </div>
            </div>
            <!-- ./Input PIN -->
            <!-- Input Konfirmasi Ulang -->
            <div class="flex flex-col gap-y-1.5">
              <div class="relative">
                <input
                  class="w-full p-3 text-sm text-gray-900 bg-white border border-gray-400 rounded-2xl pe-12 ps-12 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-green-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:invalid:ring-red-900 peer disabled:border-gray-300 disabled:bg-gray-100"
                  inputmode="numeric"
                  placeholder="Konfirmasi Ulang PIN"
                />
                <div
                  class="absolute inset-y-0 flex items-center text-gray-400 start-0 text-icon-md ps-4 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                >
                  <span class="i-material-symbols-security-rounded"></span>
                </div>
              </div>
            </div>
            <!-- ./Input Konfirmasi Ulang -->
            <!-- Button Action -->
            <button
              type="button"
              class="inline-flex items-center bg-brands-light-green p-2.5 rounded-2xl text-white uppercase gap-2 text-sm font-semibold hover:bg-brands-dark-green focus:outline-none focus:ring-2 focus:ring-green-400 disabled:cursor-not-allowed disabled:bg-gray-200 disabled:text-gray-400 justify-center"
            >
              <span>RESET PIN</span>
              <span
                class="i-material-symbols-chevron-right-rounded text-icon-md"
              ></span>
            </button>
            <!-- ./Button Action -->
          </form>
          <!-- ./Form -->
        </div>
      </div>
    </div>
    <script src="../assets/js/riset-pin.js"></script>
  </body>
</html>
